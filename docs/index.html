<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>YYDS's Blog</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="An Android Developer.">
  <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="./assets/images/favicon.webp">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/lib/themes/vue.css">
  <!-- Catppuccin 配色层：Latte（浅色）/ Mocha（深色），accent = green -->
  <link rel="stylesheet" href="https://docsify.catppuccin.com/latte/green.css" title="catppuccin-latte">
  <link rel="stylesheet" href="https://docsify.catppuccin.com/mocha/green.css" title="catppuccin-mocha" disabled>
  <link rel="stylesheet" href="./stylesheets/docsify-extra.css">
  <script>
    // 提前应用 Catppuccin 配色，避免深色模式首屏闪烁
    window.__applyCatppuccinTheme = function (isDark) {
      document.querySelectorAll('link[title="catppuccin-latte"], link[title="catppuccin-mocha"]').forEach(function (link) {
        link.disabled = link.title === ('catppuccin-' + (isDark ? 'latte' : 'mocha'));
      });
    };
    (function () {
      var isDark = false;
      try { isDark = localStorage.getItem('theme-mode') === 'dark'; } catch (e) {}
      window.__applyCatppuccinTheme(isDark);
    })();
  </script>
</head>

<body>
  <div id="app">加载中...</div>

  <script>
    // 首屏提前标记首页路由，避免独立布局闪烁
    (function () {
      var raw = (location.hash || '').replace(/^#\/?/, '').split('#')[0].split('?')[0];
      var isHome = raw === '' || /^(\.\/)?README(\.md)?\/?$/.test(raw);
      if (isHome) document.body.classList.add('is-home');
    })();
  </script>

  <script>
    window.$docsify = {
      name: "YYDS's Blog",
      repo: 'https://yudesong.github.io/docsifyBlog/',
      homepage: 'README.md',
      loadSidebar: true,
      loadNavbar: true,
      auto2top: true,
      subMaxLevel: 3,
      maxLevel: 4,
      relativePath: false,
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true
      },
      count: {
        countable: true,
        fontsize: '0.9em',
        color: 'rgb(90,90,90)',
        language: 'chinese'
      },
      plugins: [
        function (hook) {
          hook.beforeEach(function (content) {
            const meta = content.match(/^---\s*\n([\s\S]*?)\n---\s*\n/);
            const metaTitle = meta && meta[1].match(/^title:\s*["']?(.+?)["']?\s*$/m);
            content = content.replace(/^---[\s\S]*?\n---\s*\n/, '');
            if (metaTitle && !/^#\s+/m.test(content)) {
              content = '# ' + metaTitle[1].trim() + '\n\n' + content;
            }
            content = content.replace(
              /^(\s*)(!!!|\?\?\?\+?)\s*([A-Za-z0-9_-]+)?\s*(?:"([^"]*)")?\s*$/gm,
              function (_, indent, marker, type, title) {
                const label = title || type || 'Note';
                return indent + '> **' + label + '**';
              }
            );
            content = content.replace(
              /^(\s*)===\s*"([^"]+)"\s*$/gm,
              function (_, indent, title) {
                return indent + '**' + title + '**';
              }
            );
            content = content.replace(
              /\]\(\/(?!\/|assets\/)([^)#]+?)(\/)?(#.*?)?\)/g,
              function (_, path, slash, hash) {
                const normalized = path.endsWith('.md') ? path : path + '.md';
                return '](#/' + normalized + (hash || '') + ')';
              }
            );
            return content;
          });
        },
        function (hook) {
          hook.doneEach(function () {
            document.querySelectorAll('pre[data-lang="mermaid"] code').forEach(function (code) {
              const container = document.createElement('div');
              container.className = 'mermaid';
              container.textContent = code.textContent;
              code.parentElement.replaceWith(container);
            });

            if (window.mermaid) {
              mermaid.run({ querySelector: '.mermaid' }).catch(function () {});
            }
          });
        },
        function (hook) {
          hook.doneEach(function () {
            // 站点页脚：ICP 备案号
            const content = document.querySelector('.content');
            if (content && !content.querySelector('.site-footer')) {
              const footer = document.createElement('footer');
              footer.className = 'site-footer';
              footer.innerHTML =
                '<div class="site-footer-inner">' +
                '<span class="site-footer-brand">YYDS\'s Blog</span>' +
                '<span class="site-footer-divider">·</span>' +
                '<a class="site-footer-icp" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">粤ICP备2026128487号</a>' +
                '</div>';
              content.appendChild(footer);
            }

            // 首页「下滑浏览文章」：平滑滚动到文章区
            const scrollCue = document.querySelector('.home-scroll-cue');
            if (scrollCue && scrollCue.dataset.cueBound !== 'true') {
              scrollCue.dataset.cueBound = 'true';
              scrollCue.addEventListener('click', function (event) {
                const target = document.getElementById('最新文章');
                const scroller = document.querySelector('.content');
                if (!target || !scroller) return;
                event.preventDefault();
                const top = scroller.scrollTop +
                  target.getBoundingClientRect().top - scroller.getBoundingClientRect().top - 72;
                scroller.scrollTo({ top: Math.max(top, 0), behavior: 'smooth' });
              });
            }

            const sidebar = document.querySelector('.sidebar-nav');
            if (sidebar && !document.querySelector('.sidebar-theme-btn')) {
              const btn = document.createElement('button');
              btn.className = 'sidebar-theme-btn';

              const setThemeText = function () {
                const isDark = document.body.classList.contains('dark-mode');
                btn.textContent = isDark ? '切换浅色模式' : '切换深色模式';
              };

              if (localStorage.getItem('theme-mode') === 'dark') {
                document.body.classList.add('dark-mode');
              }
              window.__applyCatppuccinTheme(document.body.classList.contains('dark-mode'));

              setThemeText();
              btn.onclick = function () {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('theme-mode', isDark ? 'dark' : 'light');
                window.__applyCatppuccinTheme(isDark);
                setThemeText();
              };

              sidebar.insertBefore(btn, sidebar.firstChild);
            }

            document.querySelectorAll('.markdown-section img').forEach(function (img) {
              const src = img.getAttribute('src');
              if (!src) return;
              
              const basePath = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
                ? '/'
                : '/docsifyBlog/';

              // 处理所有包含 /assets/ 的路径。本地使用 /assets/，线上 GitHub Pages 使用 /docsifyBlog/assets/。
              if (src.includes('/assets/')) {
                const assetsIndex = src.indexOf('/assets/');
                const relativePath = src.substring(assetsIndex + 1);
                img.setAttribute('src', basePath + relativePath);
              }
            });

            const sidebarRoot = document.querySelector('.sidebar-nav > ul');
            if (!sidebarRoot) return;

            const normalizeRoute = function (href) {
              if (!href) return '';
              return href
                .replace(/^#\/\.?\//, '')
                .replace(/^#\//, '')
                .replace(/\.md$/, '')
                .replace(/\/$/, '');
            };

            const getCurrentRoute = function () {
              return normalizeRoute(location.hash.split('?')[0].split('#')[1] ? '#' + location.hash.split('?')[0].split('#')[1] : location.hash);
            };

            const currentRoute = getCurrentRoute();
            const isHome = !currentRoute || currentRoute === 'README' || currentRoute === './README';

            // 首页为独立全屏落地页：切换布局状态
            document.body.classList.toggle('is-home', isHome);

            // 首页侧边栏隐藏，提供浮动主题切换按钮
            const fab = document.querySelector('.home-theme-fab');
            if (isHome) {
              let fabBtn = fab;
              if (!fabBtn) {
                fabBtn = document.createElement('button');
                fabBtn.type = 'button';
                fabBtn.className = 'home-theme-fab';
                document.body.appendChild(fabBtn);
                fabBtn.addEventListener('click', function () {
                  const dark = !document.body.classList.contains('dark-mode');
                  document.body.classList.toggle('dark-mode', dark);
                  localStorage.setItem('theme-mode', dark ? 'dark' : 'light');
                  window.__applyCatppuccinTheme(dark);
                  const sbBtn = document.querySelector('.sidebar-theme-btn');
                  if (sbBtn) sbBtn.textContent = dark ? '切换浅色模式' : '切换深色模式';
                  updateFabText();
                });
              }
              const updateFabText = function () {
                fabBtn.textContent = document.body.classList.contains('dark-mode') ? '浅色模式' : '深色模式';
              };
              updateFabText();
            } else if (fab) {
              fab.remove();
            }

            const collapsedArticleSubnavKey = 'collapsed-article-subnav-route';

            const setCollapsedArticleSubnavRoute = function (route) {
              try {
                sessionStorage.setItem(collapsedArticleSubnavKey, route);
              } catch (_) {}
            };

            const removeCollapsedArticleSubnavRoute = function () {
              try {
                sessionStorage.removeItem(collapsedArticleSubnavKey);
              } catch (_) {}
            };

            const getCollapsedArticleSubnavRoute = function () {
              try {
                return sessionStorage.getItem(collapsedArticleSubnavKey) || '';
              } catch (_) {
                return '';
              }
            };

            const applyArticleSubnavCollapse = function () {
              sidebarRoot.querySelectorAll('.article-subnav-collapsed').forEach(function (item) {
                item.classList.remove('article-subnav-collapsed');
              });

              if (getCollapsedArticleSubnavRoute() !== currentRoute) return;

              sidebarRoot.querySelectorAll('.app-sub-sidebar').forEach(function (subnav) {
                const item = subnav.parentElement;
                if (!item) return;

                const link = Array.prototype.find.call(item.children, function (child) {
                  return child.tagName === 'A';
                });
                const isCurrentArticle = item.classList.contains('active') ||
                  normalizeRoute(link && link.getAttribute('href')) === currentRoute;

                if (isCurrentArticle) {
                  item.classList.add('article-subnav-collapsed');
                }
              });
            };

            const sidebarNav = document.querySelector('.sidebar-nav');
            if (sidebarNav && sidebarNav.dataset.routeBound !== 'true') {
              sidebarNav.dataset.routeBound = 'true';
              sidebarNav.addEventListener('click', function (event) {
                const link = event.target.closest && event.target.closest('a[href^="#/"]');
                if (!link || !sidebarNav.contains(link)) return;

                const href = link.getAttribute('href');
                if (!href || !href.startsWith('#/')) return;
                if (link.classList.contains('section-link') || href.includes('?id=')) return;

                event.preventDefault();
                event.stopPropagation();

                const targetRoute = normalizeRoute(href);
                const clickedItem = link.closest('li');
                const isCurrentRouteClick = targetRoute === getCurrentRoute();
                const shouldCollapse = isCurrentRouteClick &&
                  !(clickedItem && clickedItem.classList.contains('article-subnav-collapsed'));
                if (shouldCollapse) {
                  setCollapsedArticleSubnavRoute(targetRoute);
                } else {
                  removeCollapsedArticleSubnavRoute();
                }

                if (clickedItem && clickedItem.querySelector(':scope > .app-sub-sidebar')) {
                  clickedItem.classList.toggle('article-subnav-collapsed', shouldCollapse);
                }

                if (window.location.hash !== href) {
                  window.location.hash = href;
                }
                setTimeout(function () {
                  window.scrollTo(0, 0);
                  const content = document.querySelector('.content');
                  if (content) {
                    content.scrollTop = 0;
                  }
                }, 80);
                if (window.innerWidth <= 768) {
                  document.body.classList.remove('close');
                }
              }, true);
            }

            const routeFromContentHref = function (href) {
              if (!href) return '';
              if (href.startsWith('#/') && href.includes('?id=')) {
                const id = decodeURIComponent(href.split('?id=')[1].split('&')[0] || '');
                if (id.startsWith('/') && !id.startsWith('/assets/')) {
                  const path = id.replace(/^\/+/, '').replace(/\/$/, '');
                  const normalized = path.endsWith('.md') ? path : path + '.md';
                  return '#/' + normalized;
                }
              }
              if (href.startsWith('#/')) return href;
              if (!href.startsWith('/') || href.startsWith('//') || href.startsWith('/assets/')) return '';

              const hashIndex = href.indexOf('#');
              const path = (hashIndex >= 0 ? href.slice(0, hashIndex) : href)
                .replace(/^\/+/, '')
                .replace(/\/$/, '');
              const hash = hashIndex >= 0 ? href.slice(hashIndex) : '';
              const normalized = path.endsWith('.md') ? path : path + '.md';
              return '#/' + normalized + hash;
            };

            const redirectPathIdRoute = function () {
              if (!location.hash.includes('?id=')) return;

              const id = decodeURIComponent(location.hash.split('?id=')[1].split('&')[0] || '');
              if (!id.startsWith('/') || id.startsWith('/assets/')) return;

              const path = id.replace(/^\/+/, '').replace(/\/$/, '');
              const normalized = path.endsWith('.md') ? path : path + '.md';
              window.location.hash = '#/' + normalized;
            };

            redirectPathIdRoute();

            const contentRoot = document.querySelector('.content');
            if (contentRoot && contentRoot.dataset.routeBound !== 'true') {
              contentRoot.dataset.routeBound = 'true';
              contentRoot.addEventListener('click', function (event) {
                const link = event.target.closest && event.target.closest('.markdown-section a');
                if (!link || !contentRoot.contains(link)) return;

                const route = routeFromContentHref(link.getAttribute('href'));
                if (!route) return;

                event.preventDefault();
                event.stopPropagation();
                if (window.location.hash !== route) {
                  window.location.hash = route;
                }
                setTimeout(function () {
                  window.scrollTo(0, 0);
                  contentRoot.scrollTop = 0;
                }, 80);
              }, true);
            }

            sidebarRoot.querySelectorAll('li').forEach(function (item) {
              const childList = Array.prototype.find.call(item.children, function (child) {
                return child.tagName === 'UL' && !child.classList.contains('app-sub-sidebar');
              });
              if (!childList) return;

              item.classList.add('nav-group');

              const label = Array.prototype.find.call(item.children, function (child) {
                return child.tagName === 'STRONG';
              });
              if (label && !label.dataset.boundCollapse) {
                label.dataset.boundCollapse = 'true';
                label.setAttribute('role', 'button');
                label.setAttribute('tabindex', '0');
                label.addEventListener('click', function () {
                  item.classList.toggle('is-open');
                });
                label.addEventListener('keydown', function (event) {
                  if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    item.classList.toggle('is-open');
                  }
                });
              }

              const hasActive = !!item.querySelector('li.active, a.active');
              const hasCurrent = Array.prototype.some.call(item.querySelectorAll('a'), function (link) {
                return normalizeRoute(link.getAttribute('href')) === currentRoute;
              });
              const hasNestedGroups = !!item.querySelector(':scope > ul > li > strong');
              let depth = 0;
              let parent = item.parentElement;
              while (parent && parent !== sidebarRoot) {
                if (parent.matches && parent.matches('li.nav-group')) {
                  depth += 1;
                }
                parent = parent.parentElement;
              }

              item.classList.toggle(
                'is-open',
                (depth === 0 && hasNestedGroups) || (!isHome && (hasActive || hasCurrent))
              );
            });

            applyArticleSubnavCollapse();
          });
        }
      ]
    };
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@5/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@latest/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@latest/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5/lib/plugins/zoom-image.min.js"></script>
  <script src="//unpkg.com/docsify-count/dist/countable.js"></script>

  <script src="//cdn.jsdelivr.net/npm/prismjs@latest/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@latest/components/prism-java.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@latest/components/prism-kotlin.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@latest/components/prism-groovy.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@latest/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@latest/components/prism-yaml.min.js"></script>

  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css" />
  <script src="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/marked@3"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>

  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false });
  </script>
</body>

</html>
