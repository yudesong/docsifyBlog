<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>YYDS's Blog</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="An Android Developer.">
  <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <script>
    // Referrer 策略按路由动态切换：
    // 首页携带完整 Referer，保证百度统计可识别来源；
    // 其他页面禁用 Referer，绕过知乎、掘金等图床防盗链。
    (function () {
      function getDocsifyRoute() {
        var hash = location.hash || '';
        var queryIndex = hash.indexOf('?');
        if (queryIndex > -1) hash = hash.slice(0, queryIndex);
        return hash.replace(/^#\/?/, '');
      }

      function applyDocsifyReferrerPolicy() {
        var route = getDocsifyRoute();
        var isHomePage = !route || route === 'README' || route === 'README.md';

        var meta = document.querySelector('meta[name="referrer"]');
        if (!meta) {
          meta = document.createElement('meta');
          meta.name = 'referrer';
          document.head.appendChild(meta);
        }
        meta.content = isHomePage ? 'unsafe-url' : 'no-referrer';
      }

      window.addEventListener('hashchange', applyDocsifyReferrerPolicy);
      window.applyDocsifyReferrerPolicy = applyDocsifyReferrerPolicy;
      applyDocsifyReferrerPolicy();
    })();
  </script>
  <link rel="icon" href="./assets/images/favicon.webp">
  <link rel="stylesheet" href="/_assets/css/vue.css">
  <link rel="stylesheet" href="./stylesheets/docsify-extra.css">

<body>
  <script>
    // 首页路由提前标记：在 docsify 渲染内容前就给 body 加 home-page class，
    // 避免「先渲染默认布局 → doneEach 才加 class」造成的样式闪烁
    (function () {
      var route = (location.hash || '').replace(/^#\/?/, '').split('?')[0];
      if (!route || route === 'README' || route === 'README.md') {
        document.body.classList.add('home-page');
      }
    })();
  </script>
  <div id="app">加载中...</div>

  <script>
    window.$docsify = {
      name: "YYDS's Blog",
      repo: 'https://yudesong.github.io/docsifyBlog/',
      homepage: 'README.md',
      loadSidebar: true,
      loadNavbar: true,
      auto2top: true,
      subMaxLevel: 3,
      maxLevel: 4,
      relativePath: false,
      themeColor: '#42b983',
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true
      },
      count: {
        countable: true,
        fontsize: '0.9em',
        color: 'rgb(90,90,90)',
        language: 'chinese'
      },
      plugins: [
        function (hook) {
          hook.beforeEach(function (content) {
            // 渲染前先切换 Referrer 策略，避免外链图片按旧策略提前加载
            window.applyDocsifyReferrerPolicy && window.applyDocsifyReferrerPolicy();

            const meta = content.match(/^---\s*\n([\s\S]*?)\n---\s*\n/);
            const metaTitle = meta && meta[1].match(/^title:\s*["']?(.+?)["']?\s*$/m);
            content = content.replace(/^---[\s\S]*?\n---\s*\n/, '');
            if (metaTitle && !/^#\s+/m.test(content)) {
              content = '# ' + metaTitle[1].trim() + '\n\n' + content;
            }
            content = content.replace(
              /^(\s*)(!!!|\?\?\?\+?)\s*([A-Za-z0-9_-]+)?\s*(?:"([^"]*)")?\s*$/gm,
              function (_, indent, marker, type, title) {
                const label = title || type || 'Note';
                return indent + '> **' + label + '**';
              }
            );
            content = content.replace(
              /^(\s*)===\s*"([^"]+)"\s*$/gm,
              function (_, indent, title) {
                return indent + '**' + title + '**';
              }
            );
            content = content.replace(
              /\]\(\/(?!\/|assets\/)([^)#]+?)(\/)?(#.*?)?\)/g,
              function (_, path, slash, hash) {
                const normalized = path.endsWith('.md') ? path : path + '.md';
                return '](#/' + normalized + (hash || '') + ')';
              }
            );
            return content;
          });
        },
        function (hook) {
          // 重资源按需加载：mermaid（约 2MB）与 KaTeX（约 300KB）只在页面真正
          // 包含流程图 / 数学公式时才注入，绝大多数文章页首屏不再下载这两者。
          var CDN = '/_assets/';
          var loaded = {};

          function loadScript(src, onload) {
            if (loaded[src]) {
              if (loaded[src] === 'done' && onload) onload();
              return;
            }
            loaded[src] = 'loading';
            var s = document.createElement('script');
            s.src = src;
            s.onload = function () {
              loaded[src] = 'done';
              if (onload) onload();
            };
            s.onerror = function () {
              loaded[src] = null;
            };
            document.head.appendChild(s);
          }

          function ensureCss(href) {
            if (document.querySelector('link[data-lazy-css="' + href + '"]')) return;
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.setAttribute('data-lazy-css', href);
            link.href = href;
            document.head.appendChild(link);
          }

          hook.doneEach(function () {
            // —— mermaid：存在 ```mermaid 代码块时才加载 ——
            var mermaidCode = document.querySelectorAll('pre[data-lang="mermaid"] code');
            if (mermaidCode.length) {
              mermaidCode.forEach(function (code) {
                var container = document.createElement('div');
                container.className = 'mermaid';
                container.textContent = code.textContent;
                code.parentElement.replaceWith(container);
              });
              loadScript(CDN + 'js/mermaid.min.js', function () {
                if (!window.mermaid) return;
                if (!mermaid.__inited) {
                  mermaid.initialize({ startOnLoad: false });
                  mermaid.__inited = true;
                }
                mermaid.run({ querySelector: '.mermaid' }).catch(function () {});
              });
            }

            // —— KaTeX：渲染后的正文里检测到 $...$ / $$...$$ 才加载 ——
            // 用官方 auto-render 扫描文本节点（自动跳过 code/pre），与原 docsify-katex 的 $ 语法行为一致。
            var section = document.querySelector('.markdown-section');
            if (section && /\$\$[\s\S]+?\$\$|\$[^\$\n]+?\$/.test(section.textContent)) {
              ensureCss(CDN + 'katex/katex.min.css');
              loadScript(CDN + 'katex/katex.min.js', function () {
                loadScript(CDN + 'katex/contrib/auto-render.min.js', function () {
                  if (window.renderMathInElement && section.isConnected) {
                    renderMathInElement(section, {
                      delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false }
                      ],
                      throwOnError: false
                    });
                  }
                });
              });
            }
          });
        },
        function (hook) {
          hook.doneEach(function () {
            // 站点页脚：ICP / 公安备案号
            const content = document.querySelector('.content');
            const route = location.hash.replace(/^#\/?/, '').split('?')[0];
            const isHomePage = !route || route === 'README' || route === 'README.md';
            document.body.classList.toggle('home-page', isHomePage);
            if (isHomePage) {
              setTimeout(function () {
                document.querySelectorAll('.markdown-section div, .markdown-section p').forEach(function (item) {
                  if (/^\s*\d+\s*字\s*\|\s*\d+\s*分钟\s*$/.test(item.textContent || '')) {
                    item.remove();
                  }
                });
              }, 0);
            }
            if (content && !content.dataset.homeScrollBound) {
              content.dataset.homeScrollBound = 'true';
              // 平滑滚动到目标元素：自实现 rAF 动画。
              // 不用 scrollIntoView / 原生 smooth：docsify@5 的 <main> 是 overflow:auto 的
              // 幻影滚动容器，scrollIntoView 会被它吃掉；根元素 CSS smooth 又会让逐帧滚动互相取消。
              const smoothScrollTo = function (target) {
                const startY = window.scrollY || document.documentElement.scrollTop || 0;
                const endY = Math.max(target.getBoundingClientRect().top + startY, 0);
                if (Math.abs(endY - startY) < 2) return;
                const duration = Math.min(900, 320 + Math.abs(endY - startY) * 0.4);
                const startTime = performance.now();
                const step = function (now) {
                  const progress = Math.min((now - startTime) / duration, 1);
                  const ease = 1 - Math.pow(1 - progress, 3);
                  window.scrollTo(0, startY + (endY - startY) * ease);
                  if (progress < 1) requestAnimationFrame(step);
                };
                requestAnimationFrame(step);
              };
              content.addEventListener('click', function (event) {
                const link = event.target.closest('[data-home-scroll]');
                if (!link) return;
                event.preventDefault();
                event.stopPropagation();
                const target = document.getElementById(link.dataset.homeScroll);
                if (target) smoothScrollTo(target);
              }, true);
            }
            if (content && !content.querySelector('.site-footer')) {
              const footer = document.createElement('footer');
              footer.className = 'site-footer';
              footer.innerHTML =
                '<div class="site-footer-inner">' +
                '<span class="site-footer-brand">YYDS\'s Blog</span>' +
                '<span class="site-footer-divider">·</span>' +
                '<a class="site-footer-icp" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">粤ICP备2026128487号</a>' +
                '<span class="site-footer-divider">·</span>' +
                '<a class="site-footer-police" href="https://beian.mps.gov.cn/#/query/webSearch?code=44030002017577" target="_blank" rel="noopener noreferrer"><img class="site-footer-police-icon" src="/assets/images/beian.png" alt="" />粤公网安备44030002017577号</a>' +
                '</div>';
              content.appendChild(footer);
            }

            const sidebar = document.querySelector('.sidebar-nav');
            if (sidebar && !document.querySelector('.sidebar-theme-btn')) {
              const btn = document.createElement('button');
              btn.className = 'sidebar-theme-btn';

              const setThemeText = function () {
                const isDark = document.body.classList.contains('dark-mode');
                btn.textContent = isDark ? '切换浅色模式' : '切换深色模式';
              };

              if (localStorage.getItem('theme-mode') === 'dark') {
                document.body.classList.add('dark-mode');
              }

              setThemeText();
              btn.onclick = function () {
                document.body.classList.toggle('dark-mode');
                localStorage.setItem(
                  'theme-mode',
                  document.body.classList.contains('dark-mode') ? 'dark' : 'light'
                );
                setThemeText();
              };

              sidebar.insertBefore(btn, sidebar.firstChild);
            }

            document.querySelectorAll('.markdown-section img').forEach(function (img) {
              const src = img.getAttribute('src');
              if (!src) return;

              // 自定义域名部署在根目录，本地 docsify serve 也在根目录，统一规范为 /assets/ 绝对路径。
              if (src.includes('/assets/')) {
                const assetsIndex = src.indexOf('/assets/');
                const relativePath = src.substring(assetsIndex + 1);
                img.setAttribute('src', '/' + relativePath);
              }
            });

            const sidebarRoot = document.querySelector('.sidebar-nav > ul');
            if (!sidebarRoot) return;

            const normalizeRoute = function (href) {
              if (!href) return '';
              return href
                .replace(/^#\/\.?\//, '')
                .replace(/^#\//, '')
                .replace(/\.md$/, '')
                .replace(/\/$/, '');
            };

            const getCurrentRoute = function () {
              return normalizeRoute(location.hash.split('?')[0].split('#')[1] ? '#' + location.hash.split('?')[0].split('#')[1] : location.hash);
            };

            const currentRoute = getCurrentRoute();
            const isHome = !currentRoute || currentRoute === 'README' || currentRoute === './README';
            const collapsedArticleSubnavKey = 'collapsed-article-subnav-route';

            const setCollapsedArticleSubnavRoute = function (route) {
              try {
                sessionStorage.setItem(collapsedArticleSubnavKey, route);
              } catch (_) {}
            };

            const removeCollapsedArticleSubnavRoute = function () {
              try {
                sessionStorage.removeItem(collapsedArticleSubnavKey);
              } catch (_) {}
            };

            const getCollapsedArticleSubnavRoute = function () {
              try {
                return sessionStorage.getItem(collapsedArticleSubnavKey) || '';
              } catch (_) {
                return '';
              }
            };

            const applyArticleSubnavCollapse = function () {
              sidebarRoot.querySelectorAll('.article-subnav-collapsed').forEach(function (item) {
                item.classList.remove('article-subnav-collapsed');
              });

              if (getCollapsedArticleSubnavRoute() !== currentRoute) return;

              sidebarRoot.querySelectorAll('.app-sub-sidebar').forEach(function (subnav) {
                const item = subnav.parentElement;
                if (!item) return;

                const link = Array.prototype.find.call(item.children, function (child) {
                  return child.tagName === 'A';
                });
                const isCurrentArticle = item.classList.contains('active') ||
                  normalizeRoute(link && link.getAttribute('href')) === currentRoute;

                if (isCurrentArticle) {
                  item.classList.add('article-subnav-collapsed');
                }
              });
            };

            const sidebarNav = document.querySelector('.sidebar-nav');
            if (sidebarNav && sidebarNav.dataset.routeBound !== 'true') {
              sidebarNav.dataset.routeBound = 'true';
              sidebarNav.addEventListener('click', function (event) {
                const link = event.target.closest && event.target.closest('a[href^="#/"]');
                if (!link || !sidebarNav.contains(link)) return;

                const href = link.getAttribute('href');
                if (!href || !href.startsWith('#/')) return;
                if (link.classList.contains('section-link') || href.includes('?id=')) return;

                event.preventDefault();
                event.stopPropagation();

                const targetRoute = normalizeRoute(href);
                const clickedItem = link.closest('li');
                const isCurrentRouteClick = targetRoute === getCurrentRoute();
                const shouldCollapse = isCurrentRouteClick &&
                  !(clickedItem && clickedItem.classList.contains('article-subnav-collapsed'));
                if (shouldCollapse) {
                  setCollapsedArticleSubnavRoute(targetRoute);
                } else {
                  removeCollapsedArticleSubnavRoute();
                }

                if (clickedItem && clickedItem.querySelector(':scope > .app-sub-sidebar')) {
                  clickedItem.classList.toggle('article-subnav-collapsed', shouldCollapse);
                }

                if (window.location.hash !== href) {
                  window.location.hash = href;
                }
                setTimeout(function () {
                  window.scrollTo(0, 0);
                  const content = document.querySelector('.content');
                  if (content) {
                    content.scrollTop = 0;
                  }
                }, 80);
                if (window.innerWidth <= 768) {
                  document.body.classList.remove('close');
                }
              }, true);
            }

            const routeFromContentHref = function (href) {
              if (!href) return '';
              if (href.startsWith('#/') && href.includes('?id=')) {
                const id = decodeURIComponent(href.split('?id=')[1].split('&')[0] || '');
                if (id.startsWith('/') && !id.startsWith('/assets/')) {
                  const path = id.replace(/^\/+/, '').replace(/\/$/, '');
                  const normalized = path.endsWith('.md') ? path : path + '.md';
                  return '#/' + normalized;
                }
              }
              if (href.startsWith('#/')) return href;
              if (!href.startsWith('/') || href.startsWith('//') || href.startsWith('/assets/')) return '';

              const hashIndex = href.indexOf('#');
              const path = (hashIndex >= 0 ? href.slice(0, hashIndex) : href)
                .replace(/^\/+/, '')
                .replace(/\/$/, '');
              const hash = hashIndex >= 0 ? href.slice(hashIndex) : '';
              const normalized = path.endsWith('.md') ? path : path + '.md';
              return '#/' + normalized + hash;
            };

            const redirectPathIdRoute = function () {
              if (!location.hash.includes('?id=')) return;

              const id = decodeURIComponent(location.hash.split('?id=')[1].split('&')[0] || '');
              if (!id.startsWith('/') || id.startsWith('/assets/')) return;

              const path = id.replace(/^\/+/, '').replace(/\/$/, '');
              const normalized = path.endsWith('.md') ? path : path + '.md';
              window.location.hash = '#/' + normalized;
            };

            redirectPathIdRoute();

            const contentRoot = document.querySelector('.content');
            if (contentRoot && contentRoot.dataset.routeBound !== 'true') {
              contentRoot.dataset.routeBound = 'true';
              contentRoot.addEventListener('click', function (event) {
                const link = event.target.closest && event.target.closest('.markdown-section a');
                if (!link || !contentRoot.contains(link)) return;

                const route = routeFromContentHref(link.getAttribute('href'));
                if (!route) return;

                event.preventDefault();
                event.stopPropagation();
                if (window.location.hash !== route) {
                  window.location.hash = route;
                }
                setTimeout(function () {
                  window.scrollTo(0, 0);
                  contentRoot.scrollTop = 0;
                }, 80);
              }, true);
            }

            sidebarRoot.querySelectorAll('li').forEach(function (item) {
              const childList = Array.prototype.find.call(item.children, function (child) {
                return child.tagName === 'UL' && !child.classList.contains('app-sub-sidebar');
              });
              if (!childList) return;

              item.classList.add('nav-group');

              const label = Array.prototype.find.call(item.children, function (child) {
                return child.tagName === 'STRONG';
              });
              if (label && !label.dataset.boundCollapse) {
                label.dataset.boundCollapse = 'true';
                label.setAttribute('role', 'button');
                label.setAttribute('tabindex', '0');
                label.addEventListener('click', function () {
                  item.classList.toggle('is-open');
                });
                label.addEventListener('keydown', function (event) {
                  if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    item.classList.toggle('is-open');
                  }
                });
              }

              const hasActive = !!item.querySelector('li.active, a.active');
              const hasCurrent = Array.prototype.some.call(item.querySelectorAll('a'), function (link) {
                return normalizeRoute(link.getAttribute('href')) === currentRoute;
              });
              const hasNestedGroups = !!item.querySelector(':scope > ul > li > strong');
              let depth = 0;
              let parent = item.parentElement;
              while (parent && parent !== sidebarRoot) {
                if (parent.matches && parent.matches('li.nav-group')) {
                  depth += 1;
                }
                parent = parent.parentElement;
              }

              item.classList.toggle(
                'is-open',
                (depth === 0 && hasNestedGroups) || (!isHome && (hasActive || hasCurrent))
              );
            });

            applyArticleSubnavCollapse();
          });
        }
      ]
    };
  </script>
